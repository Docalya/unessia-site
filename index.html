<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7ef" />

    <!-- Primary SEO -->
    <title>Unessia — L'administration, enfin sereine</title>
    <meta
      name="description"
      content="Le copilote de votre vie administrative. Unessia réunit vos documents, votre budget et vos démarches dans un espace clair, lit vos papiers et anticipe vos échéances."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Unessia" />
    <link rel="canonical" href="https://unessia.fr/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-unessia.png" />
    <link rel="apple-touch-icon" href="/logo-unessia.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unessia" />
    <meta property="og:title" content="Unessia — L'administration, enfin sereine" />
    <meta
      property="og:description"
      content="Vos documents, votre budget et vos démarches, réunis dans un espace clair et serein."
    />
    <meta property="og:url" content="https://unessia.fr/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://unessia.fr/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unessia — L'administration, enfin sereine" />
    <meta
      name="twitter:description"
      content="Vos documents, votre budget et vos démarches, réunis dans un espace clair et serein."
    />
    <meta name="twitter:image" content="https://unessia.fr/og-image.jpg" />

    <!-- Image du hero chargée en priorité (affichée dès l'ouverture) -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/serenite/hero-magnolias-2400.webp"
      imagesrcset="/serenite/hero-magnolias-1200.webp 1200w, /serenite/hero-magnolias-2400.webp 2400w"
      imagesizes="100vw"
    />

    <!-- Police de l'application, hébergée sur le site (aucune requête vers Google) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/nunito-latin-wght-normal.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
